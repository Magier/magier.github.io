<figure id="fig-nest">
<figcaption><div class="ft">How the layers fit together</div>
<div class="fd">One setup that combines them. Each layer covers a different failure: the runtime limits the generated code, the process sandbox limits the agent, and an outer VM or container adds another boundary. Containers still share their host kernel. Keys and logs stay outside all of them.</div></figcaption>
<div class="svgw"><svg aria-label="Nested boxes: a microVM or container contains an OS process sandbox, which contains the agent with its permission rules and a language runtime running the generated script. Outside the microVM, a credential and egress proxy receives only allowed traffic, and logs and transcripts receive events." role="img" viewbox="0 0 680 360">
